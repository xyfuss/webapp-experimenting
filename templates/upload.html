{% extends "base.html" %} {% block title %}Clipping{% endblock %} {% block
content %}

<nav class="navbar">
  <a href="{{ url_for('home') }}" class="logo">Clips</a>
  <div class="nav-links">
    {% if current_user.is_authenticated %}
    <a href="{{ url_for('clips') }}">My clips</a>
    <a href="{{ url_for('upload') }}">Upload</a>
    <a href="{{ url_for('logout') }}">Log out</a>
    {% else %}
    <a href="{{ url_for('login') }}">Log in</a>
    <a href="{{ url_for('register') }}" class="btn-primary">Register</a>
    {% endif %}
  </div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Upload a clip</h1>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
      <label class="upload-area" for="file_upload" id="upload-label">
        Click to choose a video file
      </label>
      <input
        type="file"
        id="file_upload"
        name="file_upload"
        style="display: none"
        accept="video/*"
      />

      <input type="text" name="title" placeholder="Clip title" required />
      <input type="text" name="game" placeholder="Game name" />

      <button class="btn-primary upload-btn" type="submit">Upload</button>
      <script>
        const form = document.querySelector("form");
        const input = document.getElementById("file_upload");
        const label = document.getElementById("upload-label");
        const btn = document.querySelector(".btn-primary.upload-btn");
        const csrfToken = document.querySelector(
          'meta[name="csrf-token"]',
        ).content;

        input.addEventListener("change", () => {
          if (!input.files[0]) return;
          label.textContent = input.files[0].name;
          label.classList.add("selected");
        });

        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const file = input.files[0];
          if (!file) {
            alert("Please select a file to upload.");
            return;
          }
          btn.disabled = true;

          const res = await fetch("/upload/sign", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": csrfToken,
            },
            body: JSON.stringify({
              filename: file.name,
              content_type: file.type,
              size: file.size,
            }),
          });
          const data = await res.json();
          if (!res.ok) {
            alert(data.error || "Failed to get signed URL");
            resetButton();
            return;
          }
          console.log("Signed URL data:", data);
          const { url, key } = data;
          try {
            await uploadWithProgress(file, url, (progress) => {
              console.log(`Upload progress: ${progress.toFixed(2)}%`);
              btn.style.setProperty("--p", `${progress}%`);
              btn.textContent = `Uploading ${Math.round(progress)}%`;
            });
          } catch (err) {
            console.error("Error uploading file:", err);
            alert("Failed to upload file");
            resetButton();
            return;
          }
          console.log("File uploaded successfully:", key);

          const title = form.querySelector('input[name="title"]').value;
          const game = form.querySelector('input[name="game"]').value;
          const completeRes = await fetch("/upload/complete", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": csrfToken,
            },
            body: JSON.stringify({ key, title, game }),
          });
          const completeData = await completeRes.json();
          if (!completeRes.ok) {
            alert(completeData.error || "Failed to complete upload");
            resetButton();
            return;
          }
          console.log("Upload complete:", completeData);
          window.location.href = "/clips";
        });

        function uploadWithProgress(file, url, onProgress) {
          return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open("PUT", url);
            xhr.setRequestHeader("Content-Type", file.type);
            xhr.upload.onprogress = (e) => {
              if (e.lengthComputable) onProgress((e.loaded / e.total) * 100);
            };
            xhr.onload = () =>
              xhr.status === 200 && xhr.status < 300
                ? resolve()
                : reject(new Error(`Upload failed with status ${xhr.status}`));
            xhr.onerror = () => reject(new Error("Network error"));
            xhr.send(file);
          });
        }

        function resetButton() {
          btn.disabled = false;
          btn.style.setProperty("--p", "0%");
          btn.textContent = "Upload";
        }
      </script>
    </form>
  </div>
</div>
{% endblock %}
